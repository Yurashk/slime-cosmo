<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#080810">
  <title>Neon Slime Balance</title>
  <script type="module" crossorigin src="/slime-cosmo/assets/index-DmRZG8Nz.js"></script>
  <link rel="stylesheet" crossorigin href="/slime-cosmo/assets/index-DTTt2Xpx.css">
</head>
<body>
  <div class="game-container">
    <main class="game-main">
      <div class="canvas-wrapper">
        <canvas id="game-canvas"></canvas>
        <div id="preview-slime" class="preview-slime hidden"></div>
        <div id="drop-zone-indicator" class="drop-zone-indicator"></div>
        
        <div id="hud" class="hud">
          <div class="hud-row">
            <div class="hud-item">
              <span id="score" class="hud-value">0</span>
              <span class="hud-label">SCORE</span>
            </div>
            <div class="hud-item">
              <span id="max-level" class="hud-value">1</span>
              <span class="hud-label">MAX LEVEL</span>
            </div>
            <div class="hud-item">
              <span id="high-score" class="hud-value">0</span>
              <span class="hud-label">BEST</span>
            </div>
            <div class="hud-item">
              <span id="slime-count" class="hud-value">0</span>
              <span class="hud-label">SLIMES</span>
            </div>
          </div>
        </div>
        
        <div id="next-slime-hud" class="next-slime-hud">
          <div id="next-slime-display" class="next-slime-display"></div>
        </div>
        
        <button id="restart-btn" class="neon-btn restart-btn">RESTART</button>
      </div>
    </main>
  </div>

  <div id="game-over-overlay" class="overlay hidden">
    <div class="overlay-content">
      <h2 class="neon-text">GAME OVER</h2>
      <p class="final-score">Final Score: <span id="final-score">0</span></p>
      <p class="max-level-reached">Max Level: <span id="final-max-level">1</span></p>
      <button id="play-again-btn" class="neon-btn large">PLAY AGAIN</button>
    </div>
  </div>

</body>
</html>
