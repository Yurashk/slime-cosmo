<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#080810">
  <title>Neon Slime</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@700&family=Lilita+One&family=Montserrat:wght@700;800;900&family=Orbitron:wght@700;800;900&display=swap" rel="stylesheet">
  <script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>
  <script type="module" crossorigin src="./assets/index-SYvLAE8B.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-DPjredFi.css">
</head>
<body>
  <div class="game-container">
    <main class="game-main">

      <aside class="side-panel side-panel--collection" id="collection-panel" aria-label="Unlocked planets">
        <div class="side-panel-title"><span id="collection-panel-name">PLANETS</span> <span id="collection-panel-count">0 / 9</span></div>
        <div id="collection-bar" class="collection-bar">
          <canvas id="collection-canvas"></canvas>
        </div>
      </aside>

      <div class="canvas-wrapper">
        <canvas id="game-canvas"></canvas>
        <div id="boosters-stickers" class="boosters-stickers" aria-label="Boosters">
          <button id="booster-blackhole" class="booster-btn booster-blackhole" data-booster="blackhole" aria-label="Black hole">
            <span class="booster-icon">
              <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
                <circle cx="12" cy="12" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/>
                <path d="M12 1.6v4.4 M12 18v4.4 M1.6 12H6 M18 12h4.4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                <circle cx="12" cy="12" r="1.5" fill="currentColor"/>
              </svg>
            </span>
            <span class="booster-lock">
              <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
                <path d="M7 11V7a5 5 0 0 1 10 0v4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                <rect x="5" y="11" width="14" height="9" rx="2" fill="none" stroke="currentColor" stroke-width="2"/>
              </svg>
            </span>
            <span class="booster-count">x1</span>
          </button>
        </div>
        <div id="preview-slime" class="preview-slime hidden"></div>
        <div id="bh-banner" class="bh-banner hidden" role="status">
          <div class="bh-banner-title">BLACK HOLE</div>
          <div id="bh-banner-hint" class="bh-banner-hint">Tap a slime to eat it</div>
          <button id="bh-cancel" class="bh-cancel">CANCEL</button>
        </div>
        <div id="booster-toast" class="booster-toast hidden" role="status"></div>
        <div id="coach" class="coach hidden" role="status" aria-live="polite">
          <div class="coach-hand" aria-hidden="true">
            <svg viewBox="0 0 32 32" width="34" height="34">
              <path d="M12 15V6.5a2.5 2.5 0 0 1 5 0V14l6.2 1.5a3 3 0 0 1 2.3 3.3l-.9 6.4A4.5 4.5 0 0 1 20.1 29h-4.3a4.5 4.5 0 0 1-3.5-1.7l-5.5-6.9a2.1 2.1 0 0 1 3.1-2.8L12 19.5z" fill="#fff" stroke="#0b1030" stroke-width="1.6" stroke-linejoin="round"/>
            </svg>
          </div>
          <div class="coach-card">
            <div class="coach-demo" aria-hidden="true">
              <span class="coach-block a"></span><span class="coach-plus">+</span><span class="coach-block a"></span><span class="coach-plus">→</span><span class="coach-block b"></span>
            </div>
            <div class="coach-text"></div>
            <div class="coach-keys" aria-label="Or use the keyboard: left and right arrows to aim, Space to drop">
              or <kbd>←</kbd><kbd>→</kbd> to aim · <kbd>Space</kbd> to drop
            </div>
          </div>
        </div>

        <div id="hud" class="hud">
          <div class="glass-panel hud-bar" role="status" aria-live="polite">
            <div class="hud-stack">
              <div class="hud-stat">
                <span class="score-label">Score</span>
                <span id="score" class="score-value">0</span>
              </div>
              <div class="hud-stat">
                <span class="best-label">Best</span>
                <span id="high-score" class="best-value">0</span>
              </div>
            </div>
          </div>
          <div class="hud-actions">
            <button id="lb-toggle" class="lb-toggle" aria-label="Leaderboard">TOP</button>
            <button id="menu-btn" class="restart-btn menu-btn" aria-label="Menu">
              <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M5 7h14M5 12h14M5 17h14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
            </button>
          </div>
        </div>

        <div id="next-slime-hud" class="next-slime-hud">
          <div id="next-slime-display" class="next-slime-display"></div>
          <div id="collection-label" class="collection-label"></div>
        </div>

        <div id="unlock-popup" class="unlock-popup hidden">
          <div class="unlock-inner">
            <i class="unlock-sweep"></i>
            <div id="unlock-orb" class="unlock-orb"></div>
            <div id="unlock-name" class="unlock-name"></div>
          </div>
        </div>
      </div>

      <aside class="side-panel side-panel--leaderboard" id="leaderboard-slot" aria-label="Leaderboard"></aside>

    </main>
  </div>

  <div id="start-screen" class="overlay start-overlay">
    <canvas id="start-canvas" class="overlay-bg start-canvas" aria-hidden="true"></canvas>
    <div class="start-overlay-ui">
      <h1 class="start-title" aria-label="Neon Slime">
        <span class="t-neon" aria-hidden="true">NEON</span>
        <span class="t-slime" aria-hidden="true">SLIME</span>
      </h1>
    </div>
    <div id="start-tooltip" class="start-tooltip hidden"></div>
    <div class="start-footer">
      <div class="start-selection">
        <span id="start-selected-label" class="start-selected-label">Space</span>
        <span id="start-record-label" class="start-record-label">Record: 0</span>
      </div>
      <button id="start-play-btn" class="neon-btn large start-play">PLAY</button>
    </div>
  </div>

  <div id="bh-confirm-overlay" class="overlay hidden" role="dialog" aria-modal="true" aria-label="Black hole confirmation">
    <div class="overlay-content bh-confirm-content">
      <h2 class="neon-text">BLACK HOLE</h2>
      <p id="bh-confirm-text" class="bh-confirm-text">Eat this slime?</p>
      <canvas id="bh-confirm-canvas" class="bh-confirm-canvas" width="120" height="120" aria-hidden="true"></canvas>
      <div id="bh-confirm-name" class="bh-confirm-name">—</div>
      <div class="bh-confirm-actions">
        <button id="bh-confirm-yes" class="neon-btn bh-confirm-yes">EAT</button>
        <button id="bh-confirm-no" class="neon-btn ghost bh-confirm-no">CANCEL</button>
      </div>
    </div>
  </div>

  <div id="confirm-overlay" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
    <div class="overlay-content bh-confirm-content">
      <h2 id="confirm-title" class="neon-text"></h2>
      <p id="confirm-text" class="bh-confirm-text"></p>
      <div class="bh-confirm-actions">
        <button id="confirm-yes" class="neon-btn"></button>
        <button id="confirm-no" class="neon-btn ghost">CANCEL</button>
      </div>
    </div>
  </div>

  <div id="pause-overlay" class="overlay pause-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="pause-title">
    <div class="overlay-content pause-content">
      <h2 id="pause-title" class="neon-text">PAUSED</h2>
      <div class="pause-actions">
        <button id="pause-resume" class="pause-btn primary">Resume</button>
        <button id="pause-sound" class="pause-btn" aria-pressed="true">Sound: on</button>
        <button id="pause-restart" class="pause-btn">Restart</button>
        <button id="pause-quit" class="pause-btn">Main menu</button>
      </div>
    </div>
  </div>

  <div id="game-over-overlay" class="overlay game-over-overlay hidden" role="dialog" aria-modal="true" aria-label="Game Over">
    <canvas id="go-canvas" class="overlay-bg" aria-hidden="true"></canvas>
    <div class="game-over-card">
      <canvas id="go-confetti" class="go-confetti" aria-hidden="true"></canvas>
      <div class="go-col go-col-main">
      <h2 class="game-over-title">GAME OVER</h2>

      <div class="go-hero" aria-hidden="true">
        <div class="go-hero-rays"></div>
        <div class="go-hero-glow"></div>
        <canvas id="final-slime-avatar" class="go-hero-slime" width="112" height="112"></canvas>
      </div>
      <div class="go-hero-caption">
        <span class="biggest-slime-title">Biggest slime</span>
        <span id="final-slime-name" class="biggest-slime-name">—</span>
      </div>

      <div id="new-record" class="new-record-badge hidden">★ NEW RECORD ★</div>

      <div class="final-score-container">
        <div class="final-score-label">Final Score</div>
        <div id="final-score" class="final-score-value">0</div>
      </div>
      </div>

      <div class="go-col go-col-side">

      <div class="stats-grid">
        <div class="stat-box" id="stat-best"><span class="stat-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4h10v4a5 5 0 0 1-10 0V4Z M7 6H4a3 3 0 0 0 3 4 M17 6h3a3 3 0 0 1-3 4 M12 13v4 M8 20h8" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="stat-label">Best</span><span id="final-best" class="stat-value">0</span></div>
        <div class="stat-box"><span class="stat-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="7" cy="8" r="3.2" fill="none" stroke="currentColor" stroke-width="1.9"/><circle cx="17" cy="8" r="3.2" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M7 11.5c0 3 2.2 4.5 5 4.5s5-1.5 5-4.5 M12 16v4" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg></span><span class="stat-label">Merges</span><span id="final-merges" class="stat-value">0</span></div>
        <div class="stat-box"><span class="stat-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3c1 3.5 5 5.5 5 10a5 5 0 0 1-10 0c0-2.2 1-3.6 2.2-4.8.3 1.6 1.1 2.6 2.3 3.1C11 9 11.2 5.8 12 3Z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/></svg></span><span class="stat-label">Best Combo</span><span id="final-combo" class="stat-value">×0</span></div>
        <div class="stat-box"><span class="stat-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="7.5" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M12 9v4.2l2.8 1.8 M10 2.8h4" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="stat-label">Time</span><span id="final-time" class="stat-value">0:00</span></div>
      </div>

      <div class="go-collection">
        <div class="go-collection-head">
          <span class="go-collection-title">Collection</span>
          <span id="final-collection" class="go-collection-count">0 / 9</span>
        </div>
        <div class="go-collection-strip-wrap">
          <canvas id="go-collection-strip" class="go-collection-strip" aria-hidden="true"></canvas>
          <div id="go-collection-next" class="go-collection-next hidden"></div>
        </div>
        <div id="go-collection-hint" class="go-collection-hint"></div>
      </div>

      <button id="play-again-btn" class="btn-play-again">PLAY AGAIN</button>
      <button id="back-to-menu-btn" class="btn-back-to-menu">BACK TO MENU</button>
      </div>
    </div>
  </div>

</body>
</html>
