<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#080810">
  <title>Neon Slime Balance</title>
  <script type="module" crossorigin src="/slime-cosmo/assets/index-BZSDVbBP.js"></script>
  <link rel="stylesheet" crossorigin href="/slime-cosmo/assets/index-B90H2aeq.css">
</head>
<body>
  <div class="game-container">
    <main class="game-main">
      <div class="canvas-wrapper">
        <canvas id="game-canvas"></canvas>
        <div id="preview-slime" class="preview-slime hidden"></div>
        <div id="drop-zone-indicator" class="drop-zone-indicator"></div>
        
        <div id="hud" class="hud">
          <div class="hud-left">
            <div class="glass-panel score-panel">
              <span class="score-label">SCORE</span>
              <span id="score" class="score-value">0</span>
              <i class="panel-line"></i>
              <div class="best-row">
                <span class="best-label">BEST</span>
                <span id="high-score" class="best-value">0</span>
              </div>
            </div>
          </div>
          <div class="hud-right">
            <button id="restart-btn" class="restart-btn">⟳</button>
            <div class="glass-panel max-panel">
              <span class="max-label">MAX LV</span>
              <span id="max-level" class="max-value">1</span>
            </div>
          </div>
        </div>

        <div id="next-slime-hud" class="next-slime-hud">
          <div id="next-slime-display" class="next-slime-display"></div>
          <div id="collection-label" class="collection-label"></div>
        </div>

        <div id="unlock-popup" class="unlock-popup hidden">
          <div class="unlock-inner">
            <i class="unlock-sweep"></i>
            <div id="unlock-orb" class="unlock-orb"></div>
            <div id="unlock-name" class="unlock-name"></div>
          </div>
        </div>
      </div>
    </main>

    <div id="collection-bar" class="collection-bar">
      <canvas id="collection-canvas"></canvas>
    </div>
  </div>

  <div id="game-over-overlay" class="overlay hidden">
    <canvas id="go-canvas" class="overlay-bg" aria-hidden="true"></canvas>
    <div class="overlay-content">
      <h2 class="neon-text">GAME OVER</h2>
      <div id="new-record" class="new-record hidden">★ NEW RECORD ★</div>
      <p class="final-score">Final Score: <span id="final-score">0</span></p>

      <div class="stats-grid">
        <div class="stat"><span class="stat-label">Best</span><span id="final-best" class="stat-value">0</span></div>
        <div class="stat"><span class="stat-label">Merges</span><span id="final-merges" class="stat-value">0</span></div>
        <div class="stat"><span class="stat-label">Best Combo</span><span id="final-combo" class="stat-value">×0</span></div>
        <div class="stat"><span class="stat-label">Time</span><span id="final-time" class="stat-value">0:00</span></div>
      </div>

      <div class="final-max">
        <div id="final-slime-orb" class="final-slime-orb"></div>
        <div class="final-max-info">
          <span class="final-max-label">Biggest Slime</span>
          <span id="final-slime-name" class="final-max-name">—</span>
        </div>
      </div>

      <p class="final-collection">Collection <span id="final-collection">0 / 9</span></p>
      <button id="play-again-btn" class="neon-btn large">PLAY AGAIN</button>
    </div>
  </div>

</body>
</html>
