<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#080810">
  <title>Neon Slime Balance</title>
  <script type="module" crossorigin src="/slime-cosmo/assets/index-CncR3dJE.js"></script>
  <link rel="stylesheet" crossorigin href="/slime-cosmo/assets/index-B5Qby-ca.css">
</head>
<body>
  <div class="game-container">
    <main class="game-main">

      <aside class="side-panel side-panel--collection" id="collection-panel" aria-label="Открытые планеты">
        <div class="side-panel-title">PLANETS <span id="collection-panel-count">0 / 9</span></div>
        <div id="collection-bar" class="collection-bar">
          <canvas id="collection-canvas"></canvas>
        </div>
      </aside>

      <div class="canvas-wrapper">
        <canvas id="game-canvas"></canvas>
        <div id="boosters-stickers" class="boosters-stickers" aria-label="Бустеры">
          <button id="booster-antigravity" class="booster-btn booster-antigravity" data-booster="antigravity" aria-label="Антигравитация">
            <span class="booster-icon">
              <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
                <path d="M4 14 12 6l8 8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M4 19.5 12 11.5l8 8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M5.5 2.5h13" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="2 3"/>
              </svg>
            </span>
            <span class="booster-lock">
              <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
                <path d="M7 11V7a5 5 0 0 1 10 0v4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                <rect x="5" y="11" width="14" height="9" rx="2" fill="none" stroke="currentColor" stroke-width="2"/>
              </svg>
            </span>
            <span class="booster-count">x1</span>
          </button>
          <button id="booster-blackhole" class="booster-btn booster-blackhole" data-booster="blackhole" aria-label="Черная дыра">
            <span class="booster-icon">
              <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
                <circle cx="12" cy="12" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/>
                <path d="M12 1.6v4.4 M12 18v4.4 M1.6 12H6 M18 12h4.4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                <circle cx="12" cy="12" r="1.5" fill="currentColor"/>
              </svg>
            </span>
            <span class="booster-lock">
              <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
                <path d="M7 11V7a5 5 0 0 1 10 0v4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                <rect x="5" y="11" width="14" height="9" rx="2" fill="none" stroke="currentColor" stroke-width="2"/>
              </svg>
            </span>
            <span class="booster-count">x1</span>
          </button>
        </div>
        <div id="preview-slime" class="preview-slime hidden"></div>
        <div id="drop-zone-indicator" class="drop-zone-indicator"></div>

        <div id="hud" class="hud">
          <div class="glass-panel hud-bar" role="status" aria-live="polite">
            <div class="hud-stack">
              <div class="hud-stat">
                <span class="score-label">Score</span>
                <span id="score" class="score-value">0</span>
              </div>
              <div class="hud-stat">
                <span class="best-label">Best</span>
                <span id="high-score" class="best-value">0</span>
              </div>
            </div>
          </div>
          <div class="hud-actions">
            <button id="lb-toggle" class="lb-toggle" aria-label="Leaderboard">TOP</button>
            <button id="restart-btn" class="restart-btn" aria-label="Restart">⟳</button>
          </div>
        </div>

        <div id="next-slime-hud" class="next-slime-hud">
          <div id="next-slime-display" class="next-slime-display"></div>
          <div id="collection-label" class="collection-label"></div>
        </div>

        <div id="unlock-popup" class="unlock-popup hidden">
          <div class="unlock-inner">
            <i class="unlock-sweep"></i>
            <div id="unlock-orb" class="unlock-orb"></div>
            <div id="unlock-name" class="unlock-name"></div>
          </div>
        </div>
      </div>

      <aside class="side-panel side-panel--leaderboard" id="leaderboard-slot" aria-label="Leaderboard"></aside>

    </main>
  </div>

  <div id="ad-overlay" class="overlay hidden" role="dialog" aria-modal="true" aria-label="Rewarded video">
    <div class="overlay-content ad-content">
      <h2 class="neon-text ad-title">REWARDED VIDEO</h2>
      <p id="ad-message" class="ad-message">Загрузка рекламы…</p>
      <div class="ad-progress"><span id="ad-progress-bar"></span></div>
      <div id="ad-reward" class="ad-reward hidden">+1 BOOSTER</div>
      <button id="ad-close-btn" class="neon-btn ad-close hidden">CONTINUE</button>
    </div>
  </div>

  <div id="game-over-overlay" class="overlay hidden">
    <canvas id="go-canvas" class="overlay-bg" aria-hidden="true"></canvas>
    <div class="overlay-content">
      <h2 class="neon-text">GAME OVER</h2>
      <div id="new-record" class="new-record hidden">★ NEW RECORD ★</div>
      <p class="final-score">Final Score: <span id="final-score">0</span></p>

      <div class="stats-grid">
        <div class="stat"><span class="stat-label">Best</span><span id="final-best" class="stat-value">0</span></div>
        <div class="stat"><span class="stat-label">Merges</span><span id="final-merges" class="stat-value">0</span></div>
        <div class="stat"><span class="stat-label">Best Combo</span><span id="final-combo" class="stat-value">×0</span></div>
        <div class="stat"><span class="stat-label">Time</span><span id="final-time" class="stat-value">0:00</span></div>
      </div>

      <div class="final-max">
        <div id="final-slime-orb" class="final-slime-orb"></div>
        <div class="final-max-info">
          <span class="final-max-label">Biggest Slime</span>
          <span id="final-slime-name" class="final-max-name">—</span>
        </div>
      </div>

      <p class="final-collection">Collection <span id="final-collection">0 / 9</span></p>
      <button id="play-again-btn" class="neon-btn large">PLAY AGAIN</button>
    </div>
  </div>

</body>
</html>
